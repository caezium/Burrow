# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# CodeRabbit review settings for Burrow.
#
# The defaults assume a small single-language repo and a reviewer who wants
# prose. This is a macOS/Windows monorepo with vendored submodules and a
# generated Xcode project, so most of what follows is about pointing the
# review at code we actually own and keeping the output terse.

language: en-US
early_access: false

reviews:
  # Report what's wrong, not everything that could be said. `assertive` flags
  # stylistic nits as findings, which on a codebase with this comment density
  # produces noise that buries the real ones.
  profile: chill

  # Never let the bot hold a PR shut. It's advisory -- CI decides mergeability.
  request_changes_workflow: false

  high_level_summary: true
  review_status: true
  collapse_walkthrough: true
  poem: false

  auto_review:
    enabled: true
    # Drafts are work in progress; reviewing them wastes the run and trains
    # everyone to ignore the bot.
    drafts: false

  path_filters:
    # Vendored submodules (burrow-engine, burrow-cli) are other repositories.
    - "!macos/vendor/**"
    - "!windows/vendor/**"
    # Generated by xcodegen from macos/project.yml -- tracked but never
    # hand-edited, and it drifts on every regeneration.
    - "!macos/Resources/Info.plist"
    - "!**/*.pbxproj"
    # Binary and lock artifacts carry no reviewable intent.
    - "!**/*.ttf"
    - "!**/*.icns"
    - "!**/Assets.xcassets/**"

  path_instructions:
    - path: "macos/**/*.swift"
      instructions: >
        Comments in this codebase explain WHY, not what -- a comment restating
        the code is a finding, and so is a non-obvious decision with no comment
        at all. Flag any test whose result depends on what the build happened to
        stage (bundled sidecars in Resources/, submodule checkouts, the user's
        real UserDefaults) rather than on state the test sets up itself; that
        class of test passes on CI and fails locally, or vice versa, for reasons
        unrelated to the code. Deletion paths (CleanupAuthorization, the
        privileged helper) are safety-critical: call out anything that widens
        what can be removed, trusts a subprocess exit status over an observed
        postcondition, or drops an approved-root or volume-identity check.

    - path: "macos/HelperSources/**"
      instructions: >
        This runs as root via SMAppService. Treat every input as attacker-
        controlled: flag missing replay/nonce checks, code-signature
        requirements that a self-signed bundle could satisfy, rate limiting
        applied after authentication rather than before, and any path that
        acts on a caller-supplied path without re-validating it against the
        approved roots.

    - path: "windows/**/*.cs"
      instructions: >
        The local MCP/HTTP server binds loopback and is reachable by any
        process on the machine. Flag credential checks that run after
        expensive work, request gates that trust Host/Origin headers without
        also requiring the token, and destructive flows that skip
        ConfirmedDeletionAuthorization.

    - path: "**/*.md"
      instructions: >
        Flag claims that have gone stale against the code -- test counts,
        "verified" evidence lines, version numbers, and feature lists are the
        usual offenders. Do not comment on prose style.

chat:
  auto_reply: true
