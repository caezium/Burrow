name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version
        required: true
        default: v0.1.0-preview.1

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build release artifacts
        shell: pwsh
        run: .\scripts\build-release.ps1 -Version '${{ inputs.version }}'

      - name: Verify release artifacts
        shell: pwsh
        run: |
          $version = '${{ inputs.version }}'
          $required = @(
            "artifacts\release\Burrow-$version-win-x64-setup.exe",
            "artifacts\release\Burrow-$version-win-x64.zip",
            "artifacts\release\SHA256SUMS.txt",
            "artifacts\release\RELEASE_NOTES.md",
            "artifacts\release\winget\Caezium\Burrow\$($version.TrimStart('v'))\Caezium.Burrow.yaml",
            "artifacts\release\winget\Caezium\Burrow\$($version.TrimStart('v'))\Caezium.Burrow.installer.yaml",
            "artifacts\release\winget\Caezium\Burrow\$($version.TrimStart('v'))\Caezium.Burrow.locale.en-US.yaml"
          )
          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path)) {
              throw "Missing release artifact: $path"
            }
          }

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: Burrow ${{ inputs.version }}
          body_path: artifacts/release/RELEASE_NOTES.md
          prerelease: true
          make_latest: false
          files: |
            artifacts/release/Burrow-${{ inputs.version }}-win-x64-setup.exe
            artifacts/release/Burrow-${{ inputs.version }}-win-x64.zip
            artifacts/release/SHA256SUMS.txt
            artifacts/release/RELEASE_NOTES.md
            artifacts/release/winget/**/*.yaml
