name: windows-release

# Release-grade build of the Windows app (windows/) that BAKES the telemetry
# keys into the assembly from repo secrets, then publishes the unpackaged app
# as an artifact. Manual trigger (workflow_dispatch) so it never collides with
# the macOS tag-triggered release.yml; the full installer/winget packaging
# still lives in windows/scripts/build-release.ps1 (run locally), which picks
# up the same BURROWWIN_* env vars if they're set.
#
# Secrets consumed (set in repo Settings -> Secrets and variables -> Actions):
#   BURROWWIN_SENTRY_DSN        - the separate `burrow-windows` Sentry project DSN
#   BURROWWIN_POSTHOG_API_KEY   - the (shared) PostHog project API key
#   BURROWWIN_POSTHOG_HOST      - optional; defaults to https://us.i.posthog.com
# Any unset secret -> that SDK stays inert and the build still succeeds.

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: "Build configuration"
        required: false
        default: "Release"

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: windows
    env:
      # MSBuild exposes these as $(BURROWWIN_*) properties, which the csproj
      # bakes into AssemblyMetadata; TelemetryConfig reads them at runtime.
      BURROWWIN_SENTRY_DSN: ${{ secrets.BURROWWIN_SENTRY_DSN }}
      BURROWWIN_POSTHOG_API_KEY: ${{ secrets.BURROWWIN_POSTHOG_API_KEY }}
      BURROWWIN_POSTHOG_HOST: ${{ secrets.BURROWWIN_POSTHOG_HOST }}
    steps:
      # Every action is pinned to a commit SHA (supply-chain hygiene), matching ci.yml; the
      # version comment is what a reviewer bumps, the SHA is what actually runs.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 8.0.x

      # Build the FSL `burrow` conductor at its pinned submodule commit and stage it into Assets\
      # so the csproj bundles it (its Content Include is conditional on Exists). windows-latest
      # ships a Rust toolchain; the submodule is cloned fresh (checkout doesn't recurse
      # submodules). The public source snapshot is fetched over HTTPS without a read token.
      #
      # A failed build here FAILS THE STEP — it used to be a try/catch that downgraded any
      # failure to a `::warning::` and kept going, the exact silent-degradation shape that has
      # already shipped a broken release for this project once (see release.yml's engine-fetch
      # step, fixed the same way). The "Verify the bundled conductor + engine" step further down
      # would likely still catch a missing burrow.exe, but that's a second line of defense, not a
      # reason to let this step swallow a git/cargo failure behind a generic warning and
      # ~10 more minutes of restore/publish before the
      # release fails anyway.
      - name: Build + stage burrow conductor
        working-directory: ${{ github.workspace }}
        shell: pwsh
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: |
          $ErrorActionPreference = 'Stop'
          $gitlink = git ls-tree HEAD windows/vendor/burrow-cli
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::could not read the windows/vendor/burrow-cli gitlink (exit $LASTEXITCODE)."
            exit 1
          }
          $entry = [regex]::Match([string]$gitlink, '^160000 commit ([0-9a-f]{40})\s')
          if (-not $entry.Success) {
            Write-Host "::error::no gitlink for windows/vendor/burrow-cli in HEAD (.gitmodules / the submodule entry may be missing). Failing the build — there is no conductor to stage without it."
            exit 1
          }
          $sha = $entry.Groups[1].Value
          $dest = Join-Path $env:RUNNER_TEMP 'burrow-cli'
          git clone --quiet https://github.com/caezium/burrow-cli.git $dest
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::clone of public caezium/burrow-cli failed (exit $LASTEXITCODE)."
            exit 1
          }
          git -C $dest -c advice.detachedHead=false checkout --quiet $sha
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::cloned caezium/burrow-cli, but commit $sha does not exist on any branch there."
            exit 1
          }
          $notices = @('LICENSE.md', 'NOTICE', 'THIRD-PARTY-LICENSES.md')
          foreach ($notice in ($notices + @('LICENSES/cargo-packages.json'))) {
            $sourceNotice = Join-Path $dest $notice
            if (-not (Test-Path -LiteralPath $sourceNotice -PathType Leaf) -or
                (Get-Item -LiteralPath $sourceNotice).Length -eq 0) {
              throw "Required CLI license notice is missing or empty: $notice"
            }
          }
          $inventory = Get-Content -LiteralPath (Join-Path $dest 'LICENSES/cargo-packages.json') -Raw
          $packages = @($inventory | ConvertFrom-Json)
          if (-not $inventory.TrimStart().StartsWith('[') -or $packages.Count -eq 0) {
            throw 'CLI Cargo notice inventory is empty or invalid'
          }
          foreach ($package in $packages) {
            if ($package.texts -isnot [array] -or $package.texts.Count -eq 0) {
              throw 'CLI Cargo package has no license notices'
            }
            foreach ($text in $package.texts) {
              $relative = [string]$text.file
              if (-not $relative.StartsWith('LICENSES/cargo/', [StringComparison]::Ordinal) -or
                  $relative.Contains('\') -or ($relative.Split('/') -contains '..')) {
                throw "Invalid CLI Cargo notice path: $relative"
              }
              $sourceNotice = Join-Path $dest $relative
              if (-not (Test-Path -LiteralPath $sourceNotice -PathType Leaf) -or
                  (Get-Item -LiteralPath $sourceNotice).Length -eq 0) {
                throw "Required CLI license notice is missing or empty: $relative"
              }
            }
          }
          # The public CLI snapshot has no private Cargo git dependencies.
          cargo build --release --manifest-path (Join-Path $dest 'Cargo.toml')
          $cargoExit = $LASTEXITCODE
          if ($cargoExit -ne 0) {
            Write-Host "::error::cargo build of burrow-cli failed (exit $cargoExit)."
            exit 1
          }
          $licenseDest = 'windows/Assets/licenses/burrow-cli'
          if (Test-Path -LiteralPath $licenseDest) {
            Remove-Item -LiteralPath $licenseDest -Recurse -Force
          }
          New-Item -ItemType Directory -Path $licenseDest -Force | Out-Null
          foreach ($notice in $notices) {
            Copy-Item -LiteralPath (Join-Path $dest $notice) -Destination (Join-Path $licenseDest $notice) -Force
          }
          Copy-Item -LiteralPath (Join-Path $dest 'LICENSES') -Destination (Join-Path $licenseDest 'LICENSES') -Recurse
          Copy-Item (Join-Path $dest 'target\release\burrow.exe') 'windows\Assets\burrow.exe' -Force
          Write-Host "staged burrow.exe @ $($sha.Substring(0,7))"

      # Surface (without leaking) whether the keys will actually be baked, so a
      # release that silently shipped inert telemetry is easy to spot. Reads the
      # env (set from secrets) rather than interpolating the secret into script.
      - name: Telemetry key presence
        shell: pwsh
        run: |
          if ([string]::IsNullOrEmpty($env:BURROWWIN_SENTRY_DSN)) {
            Write-Host "::warning::BURROWWIN_SENTRY_DSN is empty - Sentry crash reporting will be inert in this build."
          } else { Write-Host "Sentry DSN present - crash reporting will be active." }
          if ([string]::IsNullOrEmpty($env:BURROWWIN_POSTHOG_API_KEY)) {
            Write-Host "::warning::BURROWWIN_POSTHOG_API_KEY is empty - PostHog analytics will be inert in this build."
          } else { Write-Host "PostHog key present - analytics will be active." }

      - name: Restore
        run: dotnet restore .\BurrowWin.sln

      - name: Test release commit
        env:
          BUILD_CONFIGURATION: ${{ github.event.inputs.configuration }}
        run: dotnet test .\Tests\BurrowWin.Tests\BurrowWin.Tests.csproj -c "$env:BUILD_CONFIGURATION" --no-restore -v:minimal

      - name: Test Mole runtime contracts
        # The bundled shim uses Windows PowerShell 5.1.
        shell: powershell
        run: .\scripts\test-mole-runtime.ps1

      - name: Publish (telemetry keys baked from secrets)
        env:
          BUILD_CONFIGURATION: ${{ github.event.inputs.configuration }}
        run: dotnet publish .\BurrowWin.csproj -c "$env:BUILD_CONFIGURATION" -p:Platform=x64 -r win-x64 --self-contained false -o .\artifacts\release-publish -v:minimal

      # A release artifact without the conductor ships with dead features while the run
      # stays green (the macOS 0.10.0 lesson) — hard-assert the publish output.
      - name: Verify the bundled conductor + engine made it into the publish
        shell: pwsh
        run: |
          .\scripts\verify-mole-runtime.ps1 `
            -EngineRoot .\artifacts\release-publish\Assets\Mole `
            -Conductor .\artifacts\release-publish\Assets\burrow.exe

      - name: Upload published app
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: burrowwin-win-x64-publish
          path: windows/artifacts/release-publish
          if-no-files-found: error
